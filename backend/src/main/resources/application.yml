spring:
  application:
    name: xju-lab
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 26MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/xju_lab}
    username: ${DATABASE_USER:xju_lab}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 8h
    redis:
      namespace: xju-lab:session
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
lab:
  timezone: ${LAB_TIMEZONE:Asia/Shanghai}
  printer:
    hp-status-enabled: ${HP_PRINTER_STATUS_ENABLED:false}
  registration-domain: ${PRODUCT_REGISTRATION_DOMAIN:*}
  frontend-origin: ${LAB_FRONTEND_ORIGIN:http://localhost:5173}
  bootstrap-admin:
    issuer: ${BOOTSTRAP_ADMIN_ISSUER:}
    subject: ${BOOTSTRAP_ADMIN_SUBJECT:}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:5000}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:60}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  monitor:
    prometheus-url: ${PROMETHEUS_URL:}
    bearer-token: ${PROMETHEUS_BEARER_TOKEN:}
    stale-after-seconds: ${METRIC_STALE_AFTER_SECONDS:90}
    alert-poll-ms: ${ALERT_POLL_MS:30000}
  oj:
    public-origin: ${OJ_PUBLIC_ORIGIN:https://oj.icthub.top}
    base-url: ${OJ_BASE_URL:}
    service-token: ${OJ_SERVICE_TOKEN:}
    import-poll-ms: ${OJ_IMPORT_POLL_MS:3000}
  approval-token-encryption-key: ${APPROVAL_TOKEN_ENCRYPTION_KEY:local-development-token-key-change-before-production}
