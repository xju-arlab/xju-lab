spring:
  application:
    name: xju-lab
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/xju_lab}
    username: ${DATABASE_USER:xju_lab}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 8h
    redis:
      namespace: xju-lab:session
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_SIZE:20MB}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
lab:
  timezone: ${LAB_TIMEZONE:Asia/Shanghai}
  admission-group: ${PRODUCT_ADMISSION_GROUP:lab-members}
  frontend-origin: ${LAB_FRONTEND_ORIGIN:http://localhost:5173}
  bootstrap-admin:
    issuer: ${BOOTSTRAP_ADMIN_ISSUER:}
    subject: ${BOOTSTRAP_ADMIN_SUBJECT:}
  upload:
    max-bytes: ${MAX_UPLOAD_BYTES:20971520}
    max-pages: ${MAX_PRINT_PAGES:200}
    max-copies: ${MAX_PRINT_COPIES:10}
  files:
    mode: ${FILES_MODE:filesystem}
    local-root: ${LOCAL_PRIVATE_FILE_ROOT:./data/private-files}
    s3-endpoint: ${S3_ENDPOINT:}
    s3-region: ${S3_REGION:us-east-1}
    s3-access-key: ${S3_ACCESS_KEY:}
    s3-secret-key: ${S3_SECRET_KEY:}
    s3-bucket: ${S3_BUCKET:xju-lab-private}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:5000}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:60}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  monitor:
    prometheus-url: ${PROMETHEUS_URL:}
    bearer-token: ${PROMETHEUS_BEARER_TOKEN:}
    stale-after-seconds: ${METRIC_STALE_AFTER_SECONDS:90}
    alert-poll-ms: ${ALERT_POLL_MS:30000}
  oj:
    public-origin: ${OJ_PUBLIC_ORIGIN:https://oj.icthub.top}
    base-url: ${OJ_BASE_URL:}
    service-token: ${OJ_SERVICE_TOKEN:}
    import-poll-ms: ${OJ_IMPORT_POLL_MS:3000}
  approval-token-encryption-key: ${APPROVAL_TOKEN_ENCRYPTION_KEY:local-development-token-key-change-before-production}
