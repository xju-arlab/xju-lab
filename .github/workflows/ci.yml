name: CI
on:
  pull_request:
  push:
    branches: [main, codex/**]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.16.0, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm api:types && git diff --exit-code -- src/api/openapi.d.ts
        working-directory: frontend
      - run: pnpm build && pnpm test:assessment && pnpm test:seats
        working-directory: frontend
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -B verify
        working-directory: backend
      - run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet
  printer-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m compileall -q printer_agent && python -m unittest discover -s tests -v
        working-directory: printer-agent
