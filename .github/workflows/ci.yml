name: CI
on:
  pull_request:
  push:
    branches: [main, codex/**]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.16.0, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm api:types && git diff --exit-code -- src/api/openapi.d.ts
        working-directory: frontend
      - run: pnpm build && pnpm test:assessment && pnpm test:seats
        working-directory: frontend
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw -B verify
        working-directory: backend
      - run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet
  verify-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.16.0, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: bash scripts/verify.sh
  browser-e2e:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: xju-lab-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.16.0, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install Chromium for the API-mode browser test
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Route the local IdP hostname to the isolated test service
        run: echo '127.0.0.1 keycloak' | sudo tee -a /etc/hosts >/dev/null
      - name: Start data services and the local test IdP
        run: docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.ci-e2e.yaml --profile app --profile local-idp --profile local-dev up -d postgres redis object-store mailpit keycloak
      - name: Wait for the local IdP before starting the API
        run: |
          set -euo pipefail
          ready=false
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8080/realms/xju-lab/.well-known/openid-configuration >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.ci-e2e.yaml --profile app --profile local-idp --profile local-dev ps
            docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.ci-e2e.yaml --profile app --profile local-idp --profile local-dev logs --tail=200 keycloak postgres redis object-store
            exit 1
          fi
      - name: Build and start the API and web containers
        run: docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.ci-e2e.yaml --profile app --profile local-idp --profile local-dev up --build -d app web
      - name: Wait for the app and web
        run: |
          set -euo pipefail
          ready=false
          attempt=0
          last_snapshot=$SECONDS
          deadline=$((SECONDS + 360))
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:18080/api/v1/health >/dev/null \
              && curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:18080/api/v1/ready >/dev/null \
              && curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:18080/ >/dev/null; then
              ready=true
              break
            fi
            if (( SECONDS - last_snapshot >= 60 )); then
              echo "::group::Local stack startup snapshot (attempt ${attempt})"
              docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.ci-e2e.yaml --profile app --profile local-idp --profile local-dev ps
              docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.ci-e2e.yaml --profile app --profile local-idp --profile local-dev logs --tail=30 app web keycloak postgres redis object-store || true
              echo "::endgroup::"
              last_snapshot=$SECONDS
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.ci-e2e.yaml --profile app --profile local-idp --profile local-dev logs --tail=200 app web keycloak postgres redis object-store
            exit 1
          fi
      - name: Seed isolated 100-member capacity smoke-test data
        run: docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.ci-e2e.yaml --profile app --profile local-idp --profile local-dev exec -T postgres psql -v ON_ERROR_STOP=1 -U xju_lab -d xju_lab < scripts/e2e/seed-capacity-members.sql
      - name: Run OIDC, business workflow, and responsive browser checks
        run: pnpm test:e2e
        working-directory: frontend
      - name: Collect stack logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.ci-e2e.yaml --profile app --profile local-idp --profile local-dev logs --tail=200 app web keycloak postgres redis object-store
      - name: Stop the isolated stack
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.ci-e2e.yaml --profile app --profile local-idp --profile local-dev down --volumes --remove-orphans
  printer-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m compileall -q printer_agent && python -m unittest discover -s tests -v
        working-directory: printer-agent
  backup-restore:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: xju-lab-backup-restore-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ACCESS_KEY_ID: local-object-store
      AWS_SECRET_ACCESS_KEY: local-object-store-password-change-me
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client and AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          test -x /usr/lib/postgresql/17/bin/pg_dump
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          if ! command -v aws >/dev/null; then sudo apt-get install -y awscli; fi
      - name: Start isolated PostgreSQL and RustFS services
        run: docker compose --env-file .env.example -f deploy/compose.yaml up -d postgres object-store
      - name: Restore a database row and private object into separate targets
        env:
          POSTGRES_PASSWORD: local-db-password-change-me
          DATABASE_URL: postgresql://xju_lab:local-db-password-change-me@127.0.0.1:5432/xju_lab_backup_restore_source
          RESTORE_DATABASE_URL: postgresql://xju_lab:local-db-password-change-me@127.0.0.1:5432/xju_lab_backup_restore_target
          S3_BUCKET: xju-lab-restore-source-${{ github.run_id }}-${{ github.run_attempt }}
          RESTORE_S3_BUCKET: xju-lab-restore-target-${{ github.run_id }}-${{ github.run_attempt }}
          BACKUP_ROOT: ${{ runner.temp }}/xju-lab-backup-restore
          BACKUP_RESTORE_TEST_CONFIRM: I_UNDERSTAND_THIS_USES_DISPOSABLE_LOCAL_TARGETS
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          ready=false
          for attempt in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U xju_lab -d xju_lab >/dev/null 2>&1 \
              && curl -fsS "$AWS_ENDPOINT_URL/health" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]
          mkdir -p "$RUNNER_TEMP/aws"
          printf '[default]\nregion = us-east-1\ns3 =\n    addressing_style = path\n' > "$RUNNER_TEMP/aws/config"
          export AWS_CONFIG_FILE="$RUNNER_TEMP/aws/config"
          export PGPASSWORD="$POSTGRES_PASSWORD"
          psql -h 127.0.0.1 -p 5432 -U xju_lab -d xju_lab -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE xju_lab_backup_restore_source' \
            -c 'CREATE DATABASE xju_lab_backup_restore_target'
          mkdir -p "$BACKUP_ROOT"
          bash scripts/test-backup-restore.sh
      - name: Stop isolated services
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yaml down --volumes --remove-orphans
